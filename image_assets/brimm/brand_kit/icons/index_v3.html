<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Speakeater App Icon v3 — S with Liquid</title>
<style>
  body { background: #0D0D0E; color: #E8E3D9; font-family: -apple-system,sans-serif; margin: 0; padding: 32px; }
  h1 { color: #C9A554; font-weight: 300; letter-spacing: 4px; margin: 0 0 8px 0; }
  .sub { color: #8B8578; margin-bottom: 32px; font-size: 14px; max-width: 700px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; max-width: 1400px; }
  .card { background: #18181B; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a2e; }
  .full { width: 100%; display: block; aspect-ratio: 1/1; }
  .preview { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: #0a0a0c; }
  .preview .s48 { width: 48px; height: 48px; border-radius: 12px; }
  .preview .s24 { width: 24px; height: 24px; border-radius: 6px; }
  .preview span { color: #8B8578; font-size: 11px; }
  .meta { padding: 12px 16px; }
  .slug { color: #C9A554; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
</style></head><body>
  <h1>SPEAKEATER · APP ICON v3 · S WITH LIQUID</h1>
  <div class="sub">5 variants of the S-with-liquid concept tuned for app icon. Each card shows 1024px master + 48dp + 24dp preview.</div>
  <div class="grid">
    <div class="card">
      <img class="full" src="v3_pour_straight_down.png" loading="lazy"/>
      <div class="preview">
        <img class="s48" src="v3_pour_straight_down.png"/><span>48dp</span>
        <img class="s24" src="v3_pour_straight_down.png"/><span>24dp</span>
      </div>
      <div class="meta"><div class="slug">pour straight down</div></div>
    </div>

    <div class="card">
      <img class="full" src="v3_pour_trail_back.png" loading="lazy"/>
      <div class="preview">
        <img class="s48" src="v3_pour_trail_back.png"/><span>48dp</span>
        <img class="s24" src="v3_pour_trail_back.png"/><span>24dp</span>
      </div>
      <div class="meta"><div class="slug">pour trail back</div></div>
    </div>

    <div class="card">
      <img class="full" src="v3_pour_splash_ripple.png" loading="lazy"/>
      <div class="preview">
        <img class="s48" src="v3_pour_splash_ripple.png"/><span>48dp</span>
        <img class="s24" src="v3_pour_splash_ripple.png"/><span>24dp</span>
      </div>
      <div class="meta"><div class="slug">pour splash ripple</div></div>
    </div>

    <div class="card">
      <img class="full" src="v3_s_morphs_to_liquid.png" loading="lazy"/>
      <div class="preview">
        <img class="s48" src="v3_s_morphs_to_liquid.png"/><span>48dp</span>
        <img class="s24" src="v3_s_morphs_to_liquid.png"/><span>24dp</span>
      </div>
      <div class="meta"><div class="slug">s morphs to liquid</div></div>
    </div>

    <div class="card">
      <img class="full" src="v3_pour_into_mini_glass.png" loading="lazy"/>
      <div class="preview">
        <img class="s48" src="v3_pour_into_mini_glass.png"/><span>48dp</span>
        <img class="s24" src="v3_pour_into_mini_glass.png"/><span>24dp</span>
      </div>
      <div class="meta"><div class="slug">pour into mini glass</div></div>
    </div></div>
</body></html>

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Pantrie build config — these are consumed by app/build.gradle.kts at build time.
PANTRIE_API_URL=https://pantrie-backend.schulgenkyle.workers.dev
PANTRIE_GOOGLE_CLIENT_ID=551337065169-ndra9iucotdmg1f4e8chcojfipo8k59q.apps.googleusercontent.com

# Leave blank for debug builds (debug network config bypasses pinning via user CAs).
# Fill BOTH with SHA-256 SPKI pins before shipping any release build.
# Generate with (Git Bash):
#   openssl s_client -servername pantrie-backend.schulgenkyle.workers.dev \
#     -connect pantrie-backend.schulgenkyle.workers.dev:443 </dev/null 2>/dev/null \
#     | openssl x509 -pubkey -noout \
#     | openssl pkey -pubin -outform der \
#     | openssl dgst -sha256 -binary | base64
#
# Captured 2026-04-26 from live Worker:
#   leaf:         xyOCNnRJY1DpRKC3QHGYykcu/aqwmij+yR8pJIflYqM=  (Cloudflare-rotated, ~60d)
#   intermediate: y7xVm0TVJNahMr2sZydE2jQH8SquXV9yLF9seROHHHU=  (Let's Encrypt E7, ~yearly)
# Do NOT enable pinning until there's an out-of-band pin-rotation channel —
# Cloudflare auto-rotates the leaf and will brick installed APKs otherwise.
PANTRIE_API_PIN_PRIMARY=
PANTRIE_API_PIN_BACKUP=

# 0 disables Play Integrity client-side. Set to your Cloud project number
# (Google Cloud Console → dashboard → project info → Project number) when ready.
PANTRIE_CLOUD_PROJECT_NUMBER=0L

# Dev-only: x-dev-key value matching the Worker's DEV_TOKEN_KEY secret.
# DO NOT put the value here — gradle.properties is committed to the repo.
# Put it in local.properties (gitignored) as PANTRIE_DEV_TOKEN_KEY=<value>.
# Release builds always inject "" via the buildTypes block in app/build.gradle.kts.
PANTRIE_DEV_TOKEN_KEY=

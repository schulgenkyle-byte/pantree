<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#F5EFE4" />
<title>Pantrie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5EFE4;--cream-2:#EDE5D5;--paper:#FAF6ED;
  --beige:#D9CFB8;--beige-deep:#C0B39A;--stone:#B8AF9B;
  --terracotta:#B5634A;--terracotta-deep:#975240;--terracotta-soft:#E8D3C7;
  --olive:#7A8664;--olive-soft:#DDE0CD;
  --ink:#2B2621;--ink-soft:#5A5148;--ink-muted:#8F877C;--ink-faint:#BDB5A8;
  --line:rgba(43,38,33,.1);--border:rgba(43,38,33,.08);--border-s:rgba(43,38,33,.16);
  --sh-sm:0 1px 3px rgba(43,38,33,.05),0 4px 16px rgba(43,38,33,.03);
  --sh-md:0 2px 6px rgba(43,38,33,.05),0 12px 32px rgba(43,38,33,.06);
  --sh-lg:0 4px 12px rgba(43,38,33,.07),0 28px 60px rgba(43,38,33,.09);
  --tab-h:72px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Mulish',system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;user-select:none;overscroll-behavior:none}
input,textarea,select{user-select:text;font-family:inherit;font-size:inherit;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.italic{font-family:'Fraunces',serif;font-style:italic;font-weight:300}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted)}
.meta{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-muted)}.soft{color:var(--ink-soft)}.center{text-align:center}
#root{height:100dvh;max-height:100dvh;width:100%;max-width:440px;margin:0 auto;position:relative;background:var(--cream);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:441px){body{background:#CDC4B0;display:flex;align-items:center;justify-content:center;padding:24px}#root{max-height:min(900px,calc(100dvh - 48px));border-radius:24px;box-shadow:0 28px 60px rgba(43,38,33,.18)}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;position:relative}
.pad{padding:20px 24px calc(var(--tab-h) + var(--safe-b) + 32px)}
.badge{position:fixed;top:6px;right:12px;font-size:9px;color:var(--ink-muted);letter-spacing:.12em;text-transform:uppercase;z-index:100;font-weight:700;opacity:.5}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex-shrink:0}
.topbar{padding:20px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-t{font-family:'Fraunces',serif;font-size:15px;font-style:italic;font-weight:300;color:var(--ink-soft)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.04em;flex-shrink:0;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .15s}
.iconbtn:hover{background:rgba(43,38,33,.05)}
.tabs{position:absolute;bottom:0;left:0;right:0;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(245,239,228,.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-muted);transition:color .2s}
.tab .ic{width:22px;height:22px}
.tab-l{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.tab.active{color:var(--ink)}
.tab-pos{position:relative}
.tab-badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--terracotta);color:var(--paper);font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.home-deck-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;margin:0 -24px;padding-left:24px;padding-right:24px;scroll-snap-type:x mandatory}
.home-deck-scroll::-webkit-scrollbar{display:none}
.home-deck-card{flex:0 0 160px;aspect-ratio:3/4;border-radius:12px;padding:14px;display:flex;flex-direction:column;text-align:left;box-shadow:var(--sh-sm);scroll-snap-align:start;position:relative;overflow:hidden;border:1px solid var(--border)}
.home-deck-card-head{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.home-deck-card-initial{font-family:'Fraunces',serif;font-size:72px;font-weight:400;letter-spacing:-.04em;color:var(--ink);opacity:.12;line-height:1;position:absolute;top:36px;right:-8px;font-variation-settings:'opsz' 144;pointer-events:none}
.home-deck-card-t{font-family:'Fraunces',serif;font-size:16px;font-weight:500;line-height:1.15;letter-spacing:-.01em;margin-top:auto;position:relative;z-index:1}
.home-deck-card-m{font-size:10px;color:var(--ink-soft);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:4px;font-weight:700;font-size:13.5px;letter-spacing:.02em;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ink);color:var(--paper)}.btn-p:hover{background:var(--ink-soft)}
.btn-g{background:transparent;color:var(--ink)}
.btn-o{background:transparent;color:var(--ink);border:1px solid var(--border-s)}
.btn-t{background:var(--terracotta);color:var(--paper)}
.btn-f{width:100%}.btn-lg{height:60px;padding:0 28px}
.btn-sm{height:38px;font-size:12px;padding:0 14px}
.btn.disabled{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--paper);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.card{background:var(--paper);border-radius:12px;border:1px solid var(--border);padding:18px}
.section{margin-bottom:32px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px}
.sec-title{font-family:'Fraunces',serif;font-size:22px;font-weight:500;letter-spacing:-.015em}
.sec-action{font-size:11.5px;font-weight:700;color:var(--ink-muted);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.sec-label{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--ink-muted);text-transform:uppercase;margin:24px 0 12px}
.hr{border:none;height:1px;background:var(--line);margin:24px 0}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--ink-faint)}
.dots span.f{background:var(--ink)}
.dots.xl{gap:10px}
.dots.xl span{width:18px;height:18px;cursor:pointer;transition:transform .12s}
.dots.xl span:active{transform:scale(1.3)}
.hero-h{font-family:'Fraunces',serif;font-size:40px;line-height:1.02;letter-spacing:-.025em;font-weight:400;font-variation-settings:"opsz" 144;margin-bottom:6px}
.edrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.edrow:last-child{border-bottom:none}
.edrow-t{width:56px;height:68px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.edrow-i{font-family:'Fraunces',serif;font-size:26px;font-weight:500;letter-spacing:-.02em;color:var(--ink);opacity:.8;font-variation-settings:"opsz" 144}
.edrow-info{flex:1;min-width:0}
.edrow-title{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-.01em;line-height:1.2;margin-bottom:4px}
.edrow-m{font-size:11px;color:var(--ink-muted);font-weight:600;letter-spacing:.04em}
.tint-american{background:#E5DCC4}.tint-italian{background:#E9DFC8}.tint-mexican{background:#E0CDB2}.tint-thai{background:#D6D8C0}.tint-chinese{background:#DBCFB5}.tint-korean{background:#D9C7B4}.tint-indian{background:#E2C9AE}.tint-french{background:#DFD4BC}.tint-mediterranean{background:#DED0B5}.tint-middle-eastern{background:#E0C9B4}.tint-japanese{background:#D4D0BD}.tint-other{background:#DED5C2}
.deck-wrap{position:relative;padding:0 20px}
.deck-stack{position:relative}
.deck-card{position:absolute;inset:0;border-radius:12px;overflow:hidden;touch-action:none;cursor:grab;will-change:transform;perspective:1400px;background:transparent!important;box-shadow:none!important}
.flipper{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.9,.3,1);transform-style:preserve-3d}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:12px;overflow:hidden;box-shadow:var(--sh-md)}
.face.back{transform:rotateY(180deg);background:var(--paper);padding:28px 24px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;touch-action:pan-y}
.card-front{position:absolute;inset:0;padding:28px;display:flex;flex-direction:column}
.card-front-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-front-body{margin-top:auto}
.card-hero{font-family:'Fraunces',serif;font-size:180px;font-weight:300;letter-spacing:-.05em;color:var(--ink);opacity:.08;line-height:1;position:absolute;top:100px;right:-20px;pointer-events:none;font-variation-settings:"opsz" 144}
.card-match{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px}
.card-match-d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--olive)}
.card-flip-b{width:36px;height:36px;border-radius:50%;background:rgba(255,253,247,.6);color:var(--ink);display:flex;align-items:center;justify-content:center;border:1px solid rgba(43,38,33,.1);pointer-events:none}
.card-c{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-expires{color:var(--terracotta);display:inline-flex;align-items:center;gap:5px}
.card-t{font-family:'Fraunces',serif;font-size:32px;font-weight:400;line-height:1.03;letter-spacing:-.025em;margin-bottom:10px;font-variation-settings:"opsz" 144}
.card-d{font-family:'Fraunces',serif;font-size:16px;font-style:italic;font-weight:300;line-height:1.4;color:var(--ink-soft);margin-bottom:16px}
.card-m{display:flex;gap:12px;align-items:center;padding-top:14px;border-top:1px solid rgba(43,38,33,.15);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);flex-wrap:wrap}
.card-m-i{display:flex;align-items:center;gap:6px}
.card-m-i .ic{width:13px;height:13px;opacity:.7}
.card-cooks{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--ink);background:rgba(255,253,247,.55);padding:4px 10px;border-radius:999px;border:1px solid rgba(43,38,33,.08);white-space:nowrap}
.swipe-l{position:absolute;top:40px;padding:10px 22px;font-family:'Fraunces',serif;font-weight:500;font-size:22px;letter-spacing:.04em;border:2px solid currentColor;border-radius:4px;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .1s;z-index:4}
.swipe-l.save{right:24px;color:var(--olive);transform:rotate(14deg)}
.swipe-l.skip{left:24px;color:var(--terracotta);transform:rotate(-14deg)}
.deck-actions{position:absolute;bottom:calc(var(--tab-h) + var(--safe-b) + 20px);left:0;right:0;display:flex;gap:18px;justify-content:center;z-index:5}
.deck-btn{width:58px;height:58px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--sh-sm);border:1px solid var(--border);transition:transform .15s}
.deck-btn:active{transform:scale(.9)}
.deck-btn.lg{width:66px;height:66px}
.deck-btn.p{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.back-label{font-size:10px;font-weight:800;letter-spacing:.15em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:8px;margin-top:4px}
.back-title{font-family:'Fraunces',serif;font-size:22px;font-weight:500;line-height:1.1;letter-spacing:-.015em}
.back-ings{display:flex;flex-wrap:wrap;gap:6px}
.back-ing{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:var(--cream);border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border)}
.back-ing.n{color:var(--ink-muted)}
.back-ing .ic{width:11px;height:11px}
.back-step{display:flex;gap:10px;font-size:13px;line-height:1.45;color:var(--ink-soft)}
.back-step-n{font-family:'Fraunces',serif;font-weight:500;color:var(--terracotta);min-width:18px;font-size:14px}
.pcat{margin-top:24px}.pcat:first-child{margin-top:0}
.pcat-l{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.pitem{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pitem.expiring-soon{padding-left:12px;border-left:3px solid var(--terracotta);margin-left:-12px;background:linear-gradient(90deg,rgba(181,99,74,.06) 0%,transparent 40%)}
.pitem.expired{padding-left:12px;border-left:3px solid var(--terracotta-deep);margin-left:-12px;background:linear-gradient(90deg,rgba(151,82,64,.12) 0%,transparent 40%)}
.pitem:last-child{border-bottom:none}
.pname{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-.005em;line-height:1.15}
.pqty{font-size:12px;color:var(--ink-muted);margin-top:3px;font-weight:500}
.pexp{font-size:10.5px;color:var(--terracotta);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.scan-hero{background:var(--ink);color:var(--paper);border-radius:12px;padding:22px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;width:100%;text-align:left;margin-bottom:24px;transition:transform .12s}
.scan-hero:active{transform:scale(.99)}
.scan-hero-e{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--terracotta-soft);margin-bottom:4px}
.scan-hero-t{font-family:'Fraunces',serif;font-size:21px;font-weight:500;line-height:1.1;letter-spacing:-.015em}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan-meal{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--border);cursor:pointer;position:relative;transition:transform .15s,border-color .15s;text-align:left;background:none}
.plan-meal:active{transform:scale(.98)}
.plan-meal.on{border-color:var(--ink);border-width:1.5px;box-shadow:var(--sh-sm)}
.plan-meal-tile{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:12px;position:relative}
.plan-meal-i{font-family:'Fraunces',serif;font-size:60px;font-weight:400;letter-spacing:-.04em;color:var(--ink);opacity:.18;font-variation-settings:"opsz" 144}
.plan-check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center}
.plan-meal-b{padding:10px 12px 14px;background:var(--paper)}
.plan-meal-t{font-family:'Fraunces',serif;font-size:14.5px;font-weight:500;line-height:1.15;letter-spacing:-.01em;margin-bottom:4px}
.plan-meal-m{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-muted);text-transform:uppercase}
.plan-bar{position:sticky;bottom:calc(var(--tab-h) + var(--safe-b) + 12px);background:var(--ink);color:var(--paper);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;z-index:15;box-shadow:var(--sh-lg);margin-top:20px}
.plan-sel{font-family:'Fraunces',serif;font-size:18px;font-weight:500}
.plan-sel em{font-style:italic;font-weight:300;opacity:.8;margin-left:6px;font-size:14px}
.ship-aisle{margin-bottom:24px}
.ship-ah{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:8px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.ship-ac{color:var(--ink-faint);font-weight:700}
.ship-i{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ship-i:last-child{border-bottom:none}
.ship-ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-s);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;transition:all .15s}
.ship-ck.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ship-n{flex:1;font-family:'Fraunces',serif;font-size:16px;font-weight:500}
.ship-q{font-size:11.5px;color:var(--ink-muted);font-weight:600}
.ship-s{font-size:9.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.ship-i.done .ship-n{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1px}
.sugg{background:var(--terracotta-soft);border-radius:12px;padding:16px 18px;margin-bottom:20px;border:1px solid rgba(181,99,74,.18)}
.sugg-h{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--terracotta-deep);text-transform:uppercase;margin-bottom:8px}
.sugg-i{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(151,82,64,.1);gap:10px}
.sugg-i:last-child{border-bottom:none}
.sugg-n{font-family:'Fraunces',serif;font-size:15px;font-weight:500}
.sugg-r{font-size:10.5px;color:var(--terracotta-deep);font-weight:600;margin-top:2px}
.sugg-a{color:var(--terracotta);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--terracotta);border-radius:999px;flex-shrink:0}
.expiring-alert{background:linear-gradient(180deg,#F5E4DC 0%,var(--terracotta-soft) 100%);border-radius:12px;padding:18px 20px;margin-bottom:20px;border:1px solid rgba(181,99,74,.25);cursor:pointer;width:100%;text-align:left}
.expiring-card{background:linear-gradient(180deg,#F5E4DC 0%,var(--terracotta-soft) 100%);border-radius:12px;padding:18px 20px;margin-bottom:20px;border:1px solid rgba(181,99,74,.25)}
.expiring-list{margin-top:12px}
.expiring-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(151,82,64,.15)}
.expiring-item-n{font-family:'Fraunces',serif;font-size:15px;font-weight:500;letter-spacing:-.005em}
.expiring-item-d{font-size:10.5px;color:var(--terracotta-deep);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.chip-sm{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--paper);border:1px solid rgba(151,82,64,.2);border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--terracotta-deep);cursor:pointer;transition:transform .1s}
.chip-sm:active{transform:scale(.95)}
.chip-sm-on{background:var(--olive-soft);border-color:rgba(122,134,100,.25);color:var(--olive)}
.expiring-alert-h{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--terracotta-deep);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.expiring-alert-t{font-family:'Fraunces',serif;font-size:20px;font-weight:500;line-height:1.2;letter-spacing:-.01em;margin-bottom:4px}
.expiring-alert-s{font-size:13px;color:var(--ink-soft);font-weight:500}

.sheet-bg{position:absolute;inset:0;background:rgba(43,38,33,.5);backdrop-filter:blur(4px);z-index:50;animation:fin .2s}

.sheet{position:absolute;bottom:0;left:0;right:0;max-height:94%;background:var(--cream);border-top-left-radius:24px;border-top-right-radius:24px;z-index:60;overflow:hidden;display:flex;flex-direction:column;animation:sup .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 -24px 60px rgba(43,38,33,.2)}

.sheet-ht{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-.01em}
.fullscreen{position:absolute;inset:0;background:var(--cream);z-index:70;display:flex;flex-direction:column;animation:fin .2s;overflow:hidden}
.rsheet-hero{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;padding:24px}

.rsheet-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(250,246,237,.85);color:var(--ink);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}

.step-row{display:flex;gap:14px;margin-bottom:18px;align-items:flex-start}

.cook-e{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--terracotta);margin-bottom:20px}
.cook-t{font-family:'Fraunces',serif;font-size:34px;font-weight:400;line-height:1.18;letter-spacing:-.02em;font-variation-settings:"opsz" 144;word-wrap:break-word}
.cook-countdown{margin-top:28px;display:flex;align-items:baseline;gap:12px}

.cook-countdown-num{font-family:'Fraunces',serif;font-size:56px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1;font-variation-settings:"opsz" 144}

.cook-sub-l{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--olive);text-transform:uppercase}
.cook-sub-t{font-family:'Fraunces',serif;font-size:14.5px;font-style:italic;font-weight:300;margin-top:4px}
.cook-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.cook-controls{padding:16px 20px calc(18px + var(--safe-b));display:flex;gap:10px;border-top:1px solid var(--line);align-items:stretch}
.cook-control-big{flex:2;height:80px;border-radius:10px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Fraunces',serif;font-size:22px;font-weight:500;letter-spacing:-.01em;transition:transform .1s}

.cook-control-sq{flex:1;height:80px;border-radius:10px;background:var(--paper);color:var(--ink);border:1px solid var(--border-s);display:flex;align-items:center;justify-content:center;transition:transform .1s}

.cook-control-sq .ic{width:28px;height:28px}
.cook-overlay{position:absolute;inset:0;background:rgba(43,38,33,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:5;color:var(--paper)}
.cook-overlay-t{font-family:'Fraunces',serif;font-size:72px;font-weight:400;letter-spacing:-.03em}
.cook-overlay-s{font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;opacity:.8}
.toast{position:absolute;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);left:20px;right:20px;background:var(--ink);color:var(--paper);padding:14px 18px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;z-index:30;box-shadow:var(--sh-lg);animation:tin .25s cubic-bezier(.2,.9,.3,1);font-size:13.5px;font-weight:600;gap:10px}
@keyframes tin{from{transform:translateY(100%);opacity:0}}
.toast button{color:var(--terracotta-soft);font-weight:700;padding:4px 8px;letter-spacing:.06em;font-size:11.5px;text-transform:uppercase}
.empty{padding:64px 32px;text-align:center}
.empty-m{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--beige);color:var(--ink-soft);margin-bottom:20px}
.empty-t{font-family:'Fraunces',serif;font-size:20px;font-weight:500;margin-bottom:6px}
.empty-s{font-size:13.5px;color:var(--ink-muted);max-width:260px;margin:0 auto}
input[type=text],input[type=number],input[type=date],input[type=url],textarea,select{width:100%;padding:14px 16px;border-radius:8px;font-size:15px;outline:none;border:1px solid var(--border-s);background:var(--paper);color:var(--ink);transition:border-color .15s;appearance:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:none;min-height:120px;line-height:1.5}
select{background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%232B2621' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center;padding-right:40px}
.seg{display:flex;padding:3px;background:var(--cream-2);border-radius:8px;margin-bottom:20px;overflow-x:auto}

.scan-wrap{flex:1;display:flex;flex-direction:column;padding:24px 20px}
.scan-frame{flex:1;background:var(--ink);border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--paper)}
.scan-sh{width:72px;height:72px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--paper);display:flex;align-items:center;justify-content:center;margin:24px auto 0}
.prof-hero{padding:32px 24px 20px;text-align:center}
.prof-av{width:72px;height:72px;border-radius:50%;background:var(--stone);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin-bottom:16px}
.prof-n{font-family:'Fraunces',serif;font-size:28px;font-weight:500;letter-spacing:-.02em}
.prof-b{font-size:14px;color:var(--ink-soft);margin-top:6px;font-style:italic;font-family:'Fraunces',serif;font-weight:300}
.prof-st{display:flex;justify-content:center;gap:32px;margin-top:20px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.prof-sn{font-family:'Fraunces',serif;font-size:22px;font-weight:500;letter-spacing:-.01em}
.prof-sl{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-muted);text-transform:uppercase;margin-top:2px}
.reason{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%;text-align:left;background:none}
.reason:last-child{border-bottom:none}
.reason-l{font-family:'Fraunces',serif;font-size:16px;font-weight:500}
.menu-i{padding:16px 20px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none}
.menu-i:last-child{border-bottom:none}
.menu-i.danger{color:var(--terracotta)}
.set-row{padding:16px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
.set-row-l{font-family:'Fraunces',serif;font-size:16px;font-weight:500;letter-spacing:-.005em}
.set-row-s{font-size:12px;color:var(--ink-muted)}
.set-row-v{font-size:13px;color:var(--ink-soft);font-weight:600}
.set-row-nav{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none}
.set-row-nav:last-child{border-bottom:none}
.set-row-nav .grow{flex:1}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--border-s);position:relative;transition:background .15s;cursor:pointer;flex-shrink:0}
.toggle.on{background:var(--ink)}
.toggle-d{width:20px;height:20px;border-radius:50%;background:var(--paper);position:absolute;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle.on .toggle-d{transform:translateX(18px)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--border-s);border-radius:8px;overflow:hidden}
.stepper button{width:36px;height:36px;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:background .15s}
.stepper button:hover{background:var(--cream-2)}
.stepper button:disabled{opacity:.3;pointer-events:none}
.stepper-v{width:40px;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.myr-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;margin-bottom:10px;transition:transform .12s}
.myr-card:active{transform:scale(.99)}
.myr-card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.myr-card-t{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-.005em;line-height:1.2;flex:1}
.myr-card-c{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-muted);text-transform:uppercase}
.coll-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.coll-card-i{width:44px;height:44px;border-radius:8px;background:var(--beige);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0}
.coll-card-t{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-.005em}
.coll-card-s{font-size:11px;color:var(--ink-muted);font-weight:600;letter-spacing:.05em;margin-top:2px}
.drag-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:grab;transition:transform .1s,box-shadow .15s;user-select:none}
.drag-row.dragging{opacity:.4;transform:scale(1.02)}
.drag-h{color:var(--ink-faint);width:20px;display:flex;justify-content:center;flex-shrink:0}
.drag-t{flex:1;font-family:'Fraunces',serif;font-size:15px;font-weight:500}
.drag-m{font-size:10.5px;color:var(--ink-muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-box{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-box-v{font-family:'Fraunces',serif;font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.stat-box-l{font-size:10.5px;color:var(--ink-muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.smart-planner-cta{background:var(--ink);color:var(--paper);border-radius:12px;padding:18px 20px;width:100%;margin-bottom:20px;transition:transform .12s;text-align:left;display:block}
.smart-planner-cta:active{transform:scale(.99)}
.smart-planner-cta-i{width:44px;height:44px;border-radius:10px;background:var(--terracotta);display:flex;align-items:center;justify-content:center;color:var(--paper);flex-shrink:0}
.smart-planner-cta-h{font-family:'Fraunces',serif;font-size:19px;font-weight:500;letter-spacing:-.01em;margin-bottom:2px}
.smart-planner-cta-s{font-size:12px;color:var(--cream-2);font-weight:500;line-height:1.35}
.planner-proposal{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.planner-proposal.on{border-color:var(--ink);border-width:1.5px}
.planner-proposal-t{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-.01em;margin-bottom:2px}
.planner-proposal-r{font-size:12px;color:var(--terracotta-deep);font-weight:600;line-height:1.45;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.planner-proposal-m{font-size:10.5px;color:var(--ink-muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.max-serve-hint{background:var(--olive-soft);border-radius:8px;padding:12px 14px;margin:14px 0 6px;display:flex;align-items:center;gap:10px}
.max-serve-hint-l{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--olive);text-transform:uppercase}
.max-serve-hint-t{font-family:'Fraunces',serif;font-size:14.5px;font-weight:500}
.missing-pill{background:var(--terracotta-soft);color:var(--terracotta-deep);padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(181,99,74,.2)}

/* Scan nudge */
.scan-nudge{position:relative;background:var(--paper);border:1px dashed var(--border-s);border-radius:12px;padding:16px 18px;margin-bottom:20px;display:flex;gap:14px;align-items:center;cursor:pointer;width:100%;text-align:left}
.scan-nudge-i{width:44px;height:44px;border-radius:10px;background:var(--cream-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0}
.scan-nudge-h{font-family:'Fraunces',serif;font-size:16.5px;font-weight:500;letter-spacing:-.005em;line-height:1.2;margin-bottom:3px}
.scan-nudge-s{font-size:12.5px;color:var(--ink-muted);font-weight:500;line-height:1.35}
.scan-nudge-x{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}

/* Recommended groceries */
.reco-card{background:var(--olive-soft);border:1px solid rgba(122,134,100,.25);border-radius:12px;padding:16px 18px;margin-bottom:20px}
.reco-h{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--olive);text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.reco-sub{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-.005em;margin-bottom:12px;line-height:1.3}
.reco-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(122,134,100,.2)}
.reco-item:first-of-type{border-top:none}
.reco-item-n{font-family:'Fraunces',serif;font-size:15px;font-weight:500}
.reco-item-u{font-size:11px;color:var(--olive);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.reco-add{color:var(--olive);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--olive);border-radius:999px;flex-shrink:0;background:var(--paper);cursor:pointer;transition:transform .1s}
.reco-add:active{transform:scale(.95)}
.reco-add.added{background:var(--olive);color:var(--paper)}

/* Week view */
.week-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px;gap:12px}
.week-head-l{font-family:'Fraunces',serif;font-size:19px;font-weight:500;letter-spacing:-.01em}
.week-head-s{font-size:11.5px;font-weight:700;color:var(--ink-muted);letter-spacing:.1em;text-transform:uppercase}
.day-strip{display:flex;gap:6px;padding:2px 0 14px;overflow-x:auto;margin:0 -24px;padding-left:24px;padding-right:24px}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:58px;border-radius:10px;background:var(--paper);border:1px solid var(--border);cursor:pointer;transition:all .15s;position:relative}
.day-pill.today{background:var(--cream-2);border-color:var(--border-s)}
.day-pill.has{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day-pill-d{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.day-pill-n{font-family:'Fraunces',serif;font-size:20px;font-weight:500;line-height:1;letter-spacing:-.02em}
.day-pill-dots{position:absolute;bottom:4px;display:flex;gap:2px}
.day-pill-dots span{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.35}
.day-pill-dots span.f{opacity:1}

.day-section{margin-bottom:18px}
.day-section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.day-section-l{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-.005em}
.day-section-l.today{color:var(--terracotta-deep)}
.day-section-l.today::before{content:'Today · ';font-style:italic;font-weight:300;font-family:'Fraunces',serif;color:var(--terracotta)}

function emptyWeekPlan(){return {0:{breakfast:null,lunch:null,dinner:null},1:{breakfast:null,lunch:null,dinner:null},2:{breakfast:null,lunch:null,dinner:null},3:{breakfast:null,lunch:null,dinner:null},4:{breakfast:null,lunch:null,dinner:null},5:{breakfast:null,lunch:null,dinner:null},6:{breakfast:null,lunch:null,dinner:null}}}

function plannedRecipeIds(){const s=new Set();Object.values(S.weekPlan).forEach(d=>SLOTS.forEach(sl=>{if(d[sl])s.add(d[sl])}));return [...s]}
function plannedSlotCount(){let n=0;Object.values(S.weekPlan).forEach(d=>SLOTS.forEach(sl=>{if(d[sl])n++}));return n}
function isPlanned(id){return plannedRecipeIds().includes(id)}
function setSlot(day,slot,rid){S.weekPlan[day][slot]=rid}
function clearSlot(day,slot){S.weekPlan[day][slot]=null}
function findSlotForRecipe(id){for(let d=0;d<7;d++){for(const s of SLOTS){if(S.weekPlan[d][s]===id)return {day:d,slot:s}}}return null}
function weekMonday(){const now=new Date();const dow=now.getDay()||7;const m=new Date(now);m.setHours(0,0,0,0);m.setDate(now.getDate()-(dow-1));return m}
function weekDates(){const m=weekMonday();return [0,1,2,3,4,5,6].map(i=>{const d=new Date(m);d.setDate(m.getDate()+i);return d})}
function fmtDay(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function fmtWeekRange(){const dates=weekDates();return fmtDay(dates[0])+' – '+fmtDay(dates[6])}
function todayIdx(){const dow=new Date().getDay();return dow===0?6:dow-1}

function daysSinceLastScan(){if(!S.lastScanAt)return Infinity;return Math.floor((Date.now()-S.lastScanAt)/86400000)}
function shouldNudgeScan(){const days=daysSinceLastScan();if(days<3)return false;if(S.scanNudgeDismissedAt){const dismissedAgo=(Date.now()-S.scanNudgeDismissedAt)/86400000;if(dismissedAgo<1)return false}return true}

function recommendedGroceries(){
  // Score each missing ingredient by how many near-makeable recipes it unlocks
  const have=new Set(S.pantry.map(p=>p.name.toLowerCase()));
  const inList=new Set(S.shopping.filter(s=>!s.checked).map(s=>s.name.toLowerCase()));
  const candidates=new Map();
  allRecipes().forEach(r=>{
    if(S.interactions[r.id]?.status==='cooked')return;
    const missing=r.ingredients.filter(i=>!have.has(i.name.toLowerCase()));
    // Only interested in recipes that are 1-2 ingredients away
    if(missing.length<1||missing.length>2)return;
    const weight=missing.length===1?3:1;
    missing.forEach(i=>{
      const key=i.name.toLowerCase();
      if(inList.has(key))return;
      if(!candidates.has(key))candidates.set(key,{name:i.name,aisle:i.aisle||'other',unit:i.unit||null,unlocks:[],score:0});
      const c=candidates.get(key);
      if(!c.unlocks.find(u=>u.id===r.id)){c.unlocks.push({id:r.id,title:r.title});c.score+=weight}
    });
  });
  return [...candidates.values()].filter(c=>c.unlocks.length>=1).sort((a,b)=>b.score-a.score).slice(0,3);
}

function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(p){return(p||'id')+'_'+Math.random().toString(36).slice(2,9)}
function ic(name,sz){return'<svg class="ic" width="'+(sz||18)+'" height="'+(sz||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-'+name+'"/></svg>'}
function allRecipes(){return[...RECIPES,...S.my_recipes]}
function findRecipe(id){return allRecipes().find(r=>r.id===id)}
function findUser(id){return USERS.find(u=>u.id===id)}
function findCollection(id){return S.collections.find(c=>c.id===id)}
function daysUntil(d){if(!d)return null;return Math.round((new Date(d)-new Date())/86400000)}
function timeAgo(h){if(h<1)return'just now';if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}
function fmtTime(s){if(s==null||s<0)s=0;const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
function maxServings(r){if(r.uses_pantry_percent>=90)return r.servings*2;if(r.uses_pantry_percent>=70)return Math.round(r.servings*1.5);return r.servings}
function tint(c){return'tint-'+(c||'Other').toLowerCase().replace(/\s+/g,'-')}
function initial(t){return(t||'?').trim().charAt(0).toUpperCase()}
function dots(v,cls){let h='<span class="dots '+(cls||'')+'">';for(let i=1;i<=5;i++)h+='<span class="'+(i<=v?'f':'')+'"></span>';return h+'</span>'}
function nFmt(n){if(n>=1000)return(n/1000).toFixed(n>=10000?0:1)+'k';return String(n)}
function expiringSoon(){return S.pantry.filter(p=>{const d=daysUntil(p.expires_at);return d!=null&&d>=0&&d<=3})}
function recipeMatchesSettings(r){
  const s=S.settings;
  if(s.max_cook_time<999&&(r.prep_minutes+r.cook_minutes)>s.max_cook_time)return false;
  if(s.diets.includes('Vegan')&&!r.dietary_flags?.includes('vegan'))return false;
  if(s.diets.includes('Vegetarian')&&!r.dietary_flags?.some(f=>f==='vegan'||f==='vegetarian'))return false;
  if(s.diets.includes('Gluten-free')&&!r.dietary_flags?.includes('gluten-free'))return false;
  if(s.allergies.length){const al=(r.allergen_warnings||[]).map(x=>x.toLowerCase());for(const a of s.allergies){if(al.includes(a.toLowerCase()))return false}}
  return true;
}
function scoreRecipe(r){
  const s=S.settings;let score=r.uses_pantry_percent*2;score+=Math.log10(Math.max(1,r.cook_count||1))*8;
  if(s.cuisines.includes(r.cuisine))score+=20;if(r.skill_level===s.skill)score+=10;
  const expiring=expiringSoon().map(p=>p.name.toLowerCase());
  if(expiring.some(e=>r.ingredients.some(i=>i.name.toLowerCase().includes(e)||e.includes(i.name.toLowerCase()))))score+=25;
  return score;
}
function sortedDeckRecipes(){return allRecipes().filter(r=>!S.interactions[r.id]).filter(recipeMatchesSettings).sort((a,b)=>scoreRecipe(b)-scoreRecipe(a))}
function smartMealPlan(){
  const expiring=expiringSoon().map(p=>p.name.toLowerCase());
  const saved=allRecipes().filter(r=>S.interactions[r.id]?.status==='saved');
  const proposals=[];const used=new Set();
  if(expiring.length){
    allRecipes().filter(r=>!used.has(r.id)&&recipeMatchesSettings(r)&&recipeUsesExpiring(r)).sort((a,b)=>scoreRecipe(b)-scoreRecipe(a)).slice(0,2).forEach(r=>{
      const uses=r.ingredients.filter(i=>expiring.some(e=>i.name.toLowerCase().includes(e)||e.includes(i.name.toLowerCase()))).map(i=>i.name);
      proposals.push({recipe:r,reason:'Uses your expiring '+uses.slice(0,2).join(' and ')});used.add(r.id);
    });
  }
  saved.filter(r=>!used.has(r.id)).slice(0,2).forEach(r=>{proposals.push({recipe:r,reason:'From your saved · '+r.uses_pantry_percent+'% on hand'});used.add(r.id)});
  allRecipes().filter(r=>!used.has(r.id)&&recipeMatchesSettings(r)&&r.uses_pantry_percent>=80).sort((a,b)=>scoreRecipe(b)-scoreRecipe(a)).slice(0,5-proposals.length).forEach(r=>{proposals.push({recipe:r,reason:r.uses_pantry_percent+'% pantry match · '+nFmt(r.cook_count||0)+' cooks'});used.add(r.id)});
  return proposals.slice(0,5);
}
function recipeUsesExpiring(r){const e=expiringSoon().map(p=>p.name.toLowerCase());return r.ingredients.some(i=>e.some(x=>i.name.toLowerCase().includes(x)||x.includes(i.name.toLowerCase())))}
function shopForRecipes(ids){
  const have=new Set(S.pantry.map(p=>p.name.toLowerCase()));const m=new Map();
  ids.forEach(rid=>{const r=findRecipe(rid);if(!r)return;r.ingredients.forEach(i=>{if(have.has(i.name.toLowerCase()))return;const k=i.name.toLowerCase();if(!m.has(k))m.set(k,{name:i.name,aisle:i.aisle||'other',items:[]});m.get(k).items.push({quantity:i.quantity,unit:i.unit,recipe_id:rid})})});
  return Array.from(m.values());
}
function recipesUnlocked(ids,extra){
  const have=new Set([...S.pantry.map(p=>p.name.toLowerCase()),...extra.map(n=>n.toLowerCase())]);
  return allRecipes().filter(r=>{if(ids.includes(r.id))return false;if(S.interactions[r.id]?.status==='cooked')return false;const c=r.ingredients.filter(i=>have.has(i.name.toLowerCase())).length;return c/r.ingredients.length>=0.85});
}

  if(S.deckHist.length)h+='<button class="deck-btn" data-a="undo-swipe">'+ic('undo',20)+'</button>';
  h+='<button class="deck-btn lg p" data-a="swipe" data-d="saved">'+ic('bookmark',24)+'</button></div></div>';
  return h;
}

function bindDeck(){
  const card=document.getElementById('top-card');if(!card)return;
  const ovS=document.getElementById('ov-save'),ovN=document.getElementById('ov-skip');
  let active=false,sx=0,sy=0,dx=0,dy=0,st=0,moved=false;
  const down=e=>{if(e.target.closest('[data-a]'))return;active=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;dy=0;st=Date.now();card.style.transition='none';try{card.setPointerCapture(e.pointerId)}catch(_){}};
  const move=e=>{if(!active)return;dx=e.clientX-sx;dy=e.clientY-sy;if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;if(Math.abs(dx)<10&&S.flipped)return;card.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(dx*.06)+'deg)';if(ovS)ovS.style.opacity=dx>50?Math.min(1,(dx-50)/70):0;if(ovN)ovN.style.opacity=dx<-50?Math.min(1,(-dx-50)/70):0};
  const up=()=>{if(!active)return;active=false;const dt=Date.now()-st;card.style.transition='transform .35s cubic-bezier(.2,.9,.3,1)';
    if(!moved&&dt<350){card.style.transform='';S.flipped=!S.flipped;render();return}
    if(Math.abs(dx)>120){const dir=dx>0?'saved':'dismissed';const fx=dx>0?600:-600;card.style.transform='translate('+fx+'px,'+dy+'px) rotate('+(fx*.04)+'deg)';
      if(dir==='dismissed'){setTimeout(()=>commitSwipe('dismissed'),280)}
      else setTimeout(()=>commitSwipe(dir),280);
    }else{card.style.transform='';if(ovS)ovS.style.opacity=0;if(ovN)ovN.style.opacity=0}
  };
  card.addEventListener('pointerdown',down);card.addEventListener('pointermove',move);card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);
}

function commitSwipe(dir,reason){
  const u=sortedDeckRecipes();const t=u[0];if(!t)return;
  S.flipped=false;
  const addedShopIds=[];
  if(dir==='saved'){
    const missing=t.ingredients.filter(i=>!i.have);
    missing.forEach(i=>{if(S.shopping.find(s=>s.name.toLowerCase()===i.name.toLowerCase()))return;const id=uid('s');S.shopping.push({id,name:i.name,quantity:i.quantity,unit:i.unit,aisle:i.aisle||'other',checked:false,source:'save',recipe_id:t.id});addedShopIds.push(id)});
  }
  S.interactions[t.id]={status:dir,saved_at:dir==='saved'?Date.now():null,dismiss_reason:reason||null};
  S.deckHist.push({id:t.id,addedShopIds});
  let msg=dir==='saved'?(addedShopIds.length?'Saved · '+addedShopIds.length+' added to list':'Saved'):'Skipped';
  const toast={msg,label:dir==='saved'?'Undo':'Why not?',action:dir==='saved'?'undo-swipe':'open-why-not'};
  if(dir==='dismissed'){S.lastDismissedId=t.id}
  S.toast=toast;setTimeout(()=>{if(S.toast&&S.toast.msg===msg){S.toast=null;render()}},3500);
  render();
}

  h+='<div class="sec-label" style="margin-top:0">Your collections</div>';
  S.collections.forEach(c=>{h+='<button class="coll-card" data-a="open-collection" data-id="'+c.id+'" style="width:100%;background:var(--paper);border:1px solid var(--border);text-align:left"><div class="coll-card-i">'+ic('folder',20)+'</div><div class="grow"><div class="coll-card-t">'+esc(c.name)+'</div><div class="coll-card-s">'+c.recipe_ids.length+' recipe'+(c.recipe_ids.length===1?'':'s')+'</div></div>'+ic('chev-r',18)+'</button>'});
  h+='<button class="btn btn-o btn-f btn-sm mt8" data-a="new-collection">'+ic('plus',14)+' New collection</button>';
  h+='<div class="sec-label">All your recipes · '+S.my_recipes.length+'</div>';
  if(S.my_recipes.length){S.my_recipes.forEach(r=>{h+='<div class="myr-card" data-a="open-recipe" data-id="'+r.id+'"><div class="myr-card-h"><div class="myr-card-t">'+esc(r.title)+'</div><div class="muted">'+ic('chev-r',16)+'</div></div><div class="myr-card-c">'+r.cuisine+' · '+(r.prep_minutes+r.cook_minutes)+' min · Serves '+r.servings+'</div></div>'})}
  else h+=emptyP('edit','Build your own library','Import from a URL, or write one from memory.');

}

function renderCollectionView(){
  const c=findCollection(S.viewingCollection);
  if(!c){S.route='mine';S.mineTab='recipes';return renderMine()}
  const recipes=c.recipe_ids.map(id=>findRecipe(id)).filter(Boolean);
  const available=allRecipes().filter(r=>!c.recipe_ids.includes(r.id));
  let h='<div class="screen"><div class="topbar"><button class="iconbtn" data-a="set-mine-tab" data-t="recipes">'+ic('chev-l',20)+'</button><span class="topbar-t">Collection</span><button class="iconbtn" data-a="collection-rename" data-id="'+c.id+'">'+ic('edit',18)+'</button></div><div class="pad">';
  h+='<div class="hero-h mb8">'+esc(c.name)+'</div><p style="font-size:13.5px;color:var(--ink-muted);margin-bottom:20px">Drag to reorder. Add recipes from below.</p>';
  if(recipes.length){recipes.forEach((r,idx)=>{h+='<div class="drag-row" draggable="true" data-id="'+r.id+'" data-idx="'+idx+'" data-col="'+c.id+'"><div class="drag-h">'+ic('drag',16)+'</div><div class="drag-t">'+esc(r.title)+'</div><div class="drag-m">'+r.cuisine+'</div><button class="iconbtn" data-a="collection-remove" data-id="'+r.id+'" data-col="'+c.id+'">'+ic('x',16)+'</button></div>'})}
  else h+=emptyP('folder','Empty collection','Add recipes from below.');
  h+='<div class="sec-label">Add to this collection</div>';
  available.slice(0,12).forEach(r=>{h+='<button class="coll-card" style="width:100%;background:var(--paper);border:1px solid var(--border);text-align:left" data-a="collection-add" data-id="'+r.id+'" data-col="'+c.id+'"><div class="coll-card-i '+tint(r.cuisine)+'"><span style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:500;color:var(--ink);opacity:.7">'+initial(r.title)+'</span></div><div class="grow"><div class="coll-card-t">'+esc(r.title)+'</div><div class="coll-card-s">'+r.cuisine+' · '+(r.prep_minutes+r.cook_minutes)+' min</div></div>'+ic('plus',18)+'</button>'});
  h+='</div></div>';
  return h;
}

function renderFeed(){
  const leader=allRecipes().slice().sort((a,b)=>(b.cook_count||0)-(a.cook_count||0)).slice(0,8);
  const mine=S.reviews.filter(r=>r.is_public).map(r=>({id:r.id,user_id:'me',recipe_id:r.recipe_id,pots:r.rating_pots,notes:r.notes,hours_ago:0}));
  const fr=FRIEND_REVIEWS.filter(r=>S.follows[r.user_id]);
  const all=[...mine,...fr];
  let c;
  if(S.feedTab==='following'){
    if(all.length){c='';all.forEach(r=>{const rec=findRecipe(r.recipe_id);const u=r.user_id==='me'?{name:S.settings.name,initials:S.settings.initials,id:'me'}:findUser(r.user_id);c+='<div class="fcard"><div class="fhead"><div class="favatar" data-a="view-profile" data-id="'+r.user_id+'">'+u.initials+'</div><div class="grow"><div class="fname" data-a="view-profile" data-id="'+r.user_id+'">'+esc(u.name)+'</div><div class="fwhen">'+timeAgo(r.hours_ago)+'</div></div>'+(r.user_id!=='me'?'<button class="iconbtn" data-a="review-menu" data-id="'+r.id+'" data-user="'+r.user_id+'">'+ic('more',18)+'</button>':'')+'</div><div class="fphoto '+tint(rec.cuisine)+'"><span class="fphoto-i">'+initial(rec.title)+'</span></div><div class="fbody" data-a="open-recipe" data-id="'+rec.id+'"><div class="flex items-c jb g12 mb8"><div class="frtitle">'+esc(rec.title)+'</div>'+dots(r.pots)+'</div>'+(r.notes?'<div style="font-size:13px;color:var(--ink-soft)">'+esc(r.notes)+'</div>':'')+'</div></div>'})}
    else c=emptyP('users','Following no one yet','Discover cooks in Most Made.');
  }else{
    c='<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:24px">Most-made recipes this week.</p><div class="edit-list">';
    leader.forEach((r,i)=>{c+='<div class="edit-row" data-a="open-recipe" data-id="'+r.id+'"><div class="edit-rank">'+String(i+1).padStart(2,'0')+'</div><div class="edit-info"><div class="edit-t">'+esc(r.title)+'</div><div class="edit-s">'+r.cuisine+' · '+nFmt(r.cook_count||0)+' cooks</div></div>'+dots(Math.round(r.avg_rating))+'</div>'});
    c+='</div>';
  }
  return '<div class="screen"><div class="topbar"><button class="iconbtn" data-a="set-mine-tab" data-t="portfolio">'+ic('chev-l',20)+'</button><span class="topbar-t">From the community</span><div class="avatar" data-a="route" data-r="settings">'+esc(S.settings.initials)+'</div></div><div class="pad"><div class="hero-h mb24">What others<br><span class="italic">are making</span>.</div><div class="seg"><button class="seg-b '+(S.feedTab==='following'?'on':'')+'" data-a="set-feed-tab" data-t="following">Following</button><button class="seg-b '+(S.feedTab==='mostmade'?'on':'')+'" data-a="set-feed-tab" data-t="mostmade">Most made</button></div>'+c+'</div></div>';
}

function renderProfile(){
  const u=findUser(S.viewingProfile);if(!u){S.route='mine';return renderMine()}
  const f=!!S.follows[u.id];
  const rev=FRIEND_REVIEWS.filter(r=>r.user_id===u.id);
  let h='<div class="screen"><div class="topbar"><button class="iconbtn" data-a="route" data-r="mine">'+ic('chev-l',20)+'</button><span class="topbar-t">&nbsp;</span><button class="iconbtn" data-a="open-report" data-id="'+u.id+'" data-kind="user">'+ic('more',18)+'</button></div><div class="pad" style="padding-top:4px"><div class="prof-hero"><div class="prof-av">'+u.initials+'</div><div class="prof-n">'+esc(u.name)+'</div>'+(u.bio?'<div class="prof-b">'+esc(u.bio)+'</div>':'')+'<div class="prof-st"><div><div class="prof-sn">'+u.cooked_count+'</div><div class="prof-sl">Cooked</div></div><div><div class="prof-sn">'+u.followers+'</div><div class="prof-sl">Followers</div></div><div><div class="prof-sn">'+u.following+'</div><div class="prof-sl">Following</div></div></div><button class="btn '+(f?'btn-o':'btn-p')+' mt24" style="min-width:160px" data-a="toggle-follow" data-id="'+u.id+'">'+(f?'Following':'Follow')+'</button></div><div class="sec-label">Recent cooks</div>';
  if(rev.length){rev.forEach(r=>{const rec=findRecipe(r.recipe_id);h+='<div class="edrow" data-a="open-recipe" data-id="'+rec.id+'"><div class="edrow-t '+tint(rec.cuisine)+'"><span class="edrow-i">'+initial(rec.title)+'</span></div><div class="edrow-info"><div class="edrow-title">'+esc(rec.title)+'</div><div class="edrow-m">'+timeAgo(r.hours_ago)+'</div></div>'+dots(r.pots)+'</div>'})}

/* ========= SHEETS ========= */
function renderSheet(){
  if(!S.sheet)return'';
  let i='';
  if(S.sheet.type==='recipe')i=renderRecipeSheet(S.sheet.recipe);
  else if(S.sheet.type==='dismiss-reason')i=renderDismissSheet(S.sheet.recipe);
  else if(S.sheet.type==='review-menu')i=renderReviewMenu(S.sheet.data);
  else if(S.sheet.type==='report')i=renderReportSheet(S.sheet.data);
  else if(S.sheet.type==='add-item')i=renderAddItem();
  else if(S.sheet.type==='add-shop')i=renderAddShop();
  else if(S.sheet.type==='pref')i=renderPrefSheet(S.sheet.key);
  else if(S.sheet.type==='new-coll')i=renderNewCollSheet(S.sheet.from_recipe);
  else if(S.sheet.type==='add-to-coll')i=renderAddToCollSheet(S.sheet.recipe_id);
  else if(S.sheet.type==='recipes-using')i=renderRecipesUsingSheet(S.sheet.item,S.sheet.recipes);
  else if(S.sheet.type==='pantry-edit')i=renderPantryEditSheet(S.sheet.item);
  else if(S.sheet.type==='slot-pick')i=renderSlotPickerSheet();
  else if(S.sheet.type==='slot-action')i=renderSlotActionSheet();
  return'<div class="sheet-bg" data-a="close-sheet"></div><div class="sheet">'+i+'</div>';
}

function renderRecipeSheet(r){
  const st=S.interactions[r.id]?.status;
  const ms=maxServings(r);
  const missing=r.ingredients.filter(i=>!i.have).length;
  let ings='';r.ingredients.forEach(i=>{ings+='<div class="ing-row"><div class="ing-ck '+(i.have?'h':'n')+'">'+(i.have?ic('check',12):'')+'</div><div class="grow"><div class="ing-n">'+esc(i.name)+'</div>'+(i.subs?'<div class="ing-sub">Or: '+i.subs.join(', ')+'</div>':'')+'</div><div class="ing-q">'+(i.quantity||'')+' '+esc(i.unit||'')+'</div></div>'});
  let steps='';r.steps.forEach(s=>{steps+='<div class="step-row"><div class="step-n">'+String(s.order).padStart(2,'0')+'</div><div class="step-t">'+esc(s.text)+(s.duration?'<div class="step-tm">'+ic('clock',11)+' '+Math.round(s.duration/60)+' min</div>':'')+'</div></div>'});
  const usesExp=recipeUsesExpiring(r);
  let h='<div class="sheet-h"></div><div class="sheet-scroll"><div class="rsheet-hero '+tint(r.cuisine)+'"><div class="rsheet-hero-i">'+initial(r.title)+'</div><button class="rsheet-close" data-a="close-sheet">'+ic('x',18)+'</button></div><div style="padding:24px">';
  h+='<div class="flex g6 mb16" style="flex-wrap:wrap"><div class="chip"><span class="card-match-d"></span>&nbsp;'+r.uses_pantry_percent+'% match</div><div class="chip">'+r.cuisine+'</div><div class="chip">'+r.skill_level+'</div>'+(usesExp?'<div class="chip" style="background:var(--terracotta-soft);color:var(--terracotta-deep);border-color:rgba(181,99,74,.3)">'+ic('alert',11)+' Uses expiring</div>':'')+(missing>0?'<div class="chip missing-pill">'+missing+' missing</div>':'')+'</div>';
  h+='<div style="font-family:\'Fraunces\',serif;font-size:30px;font-weight:400;line-height:1.1;letter-spacing:-.02em;margin-bottom:8px;font-variation-settings:\'opsz\' 144">'+esc(r.title)+'</div>';
  h+='<p style="font-family:\'Fraunces\',serif;font-style:italic;font-weight:300;font-size:15px;color:var(--ink-soft);margin-bottom:16px">'+esc(r.description)+'</p>';
  if(ms>r.servings)h+='<div class="max-serve-hint"><div>'+ic('users',16)+'</div><div class="grow"><div class="max-serve-hint-l">With what you have</div><div class="max-serve-hint-t">Make up to '+ms+' servings</div></div></div>';
  h+='<div class="flex items-c jb mb16" style="padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:16px">';
  h+='<div><div class="eyebrow">Prep</div><div style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:500">'+r.prep_minutes+'m</div></div>';
  h+='<div><div class="eyebrow">Cook</div><div style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:500">'+r.cook_minutes+'m</div></div>';
  h+='<div><div class="eyebrow">Serves</div><div style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:500">'+(ms>r.servings?r.servings+'-'+ms:r.servings)+'</div></div>';
  if(r.cost_per_serving)h+='<div><div class="eyebrow">Per serve</div><div style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:500">$'+r.cost_per_serving.toFixed(2)+'</div></div>';
  if(r.calories)h+='<div><div class="eyebrow">Cal</div><div style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:500">'+r.calories+'</div></div>';
  h+='</div>';
  h+='<div class="flex items-c g8 mb16" style="flex-wrap:wrap"><div class="eyebrow">Popular</div><div style="font-size:12px;font-weight:700">'+nFmt(r.cook_count||0)+' cooks · '+dots(Math.round(r.avg_rating))+' ('+r.total_ratings+')</div></div>';
  h+='<div class="sec-label" style="margin-top:0">Ingredients</div><div class="mb24">'+ings+'</div>';
  h+='<div class="sec-label">Method</div><div>'+steps+'</div>';
  h+='<div style="padding-top:8px"><button class="btn btn-o btn-f" data-a="open-add-to-coll" data-id="'+r.id+'">'+ic('folder',16)+' Add to collection</button></div>';
  h+='</div></div><div style="padding:16px 20px calc(16px + var(--safe-b));border-top:1px solid var(--line);background:var(--cream);display:flex;gap:10px">';
  if(!isPlanned(r.id))h+='<button class="btn btn-o grow" data-a="plan-add" data-id="'+r.id+'">Add to plan</button>';
  h+='<button class="btn btn-p btn-lg" style="flex:1.5" data-a="start-cook" data-id="'+r.id+'">Begin cooking</button></div>';
  return h;
}

function renderPrefSheet(key){
  const s=S.settings;
  if(key==='skill'){let h='<div class="sheet-h"></div><div class="sheet-head"><div style="width:40px"></div><span class="sheet-ht">Skill level</span><button class="iconbtn" data-a="close-sheet">'+ic('x',18)+'</button></div><div class="sheet-scroll" style="padding:8px 24px 32px">';SKILL.forEach(x=>{h+='<button class="reason" data-a="set-pref" data-k="skill" data-v="'+x.v+'"><span class="reason-l">'+x.l+'</span>'+(s.skill===x.v?ic('check',18):'')+'</button>'});h+='</div>';return h}
  if(key==='max_cook_time'){let h='<div class="sheet-h"></div><div class="sheet-head"><div style="width:40px"></div><span class="sheet-ht">Max cook time</span><button class="iconbtn" data-a="close-sheet">'+ic('x',18)+'</button></div><div class="sheet-scroll" style="padding:8px 24px 32px">';COOK_TIMES.forEach(x=>{h+='<button class="reason" data-a="set-pref" data-k="max_cook_time" data-v="'+x.v+'"><span class="reason-l">'+x.l+'</span>'+(s.max_cook_time===x.v?ic('check',18):'')+'</button>'});h+='</div>';return h}
  return'';

/* COOK MODE - rebuilt auto-advance + swipe */
function renderCook(){
  const c=S.cook;const r=c.recipe;if(!r){S.fullscreen=null;return''}
  const step=r.steps[c.idx];const total=step.duration||60;const remaining=c.remaining;
  const pct=Math.max(0,Math.min(100,((total-remaining)/total)*100));
  const sub=step.text.match(/\bbutter\b|\bcream\b/i)?'Out of butter? Olive oil works. Heavy cream can be coconut cream.':null;
  const isLast=c.idx>=r.steps.length-1;
  let h='<div class="fullscreen">';
  h+='<div class="cook-top"><button class="iconbtn" data-a="close-fs">'+ic('x',22)+'</button><span class="meta">'+esc(r.title)+' · '+(c.idx+1)+'/'+r.steps.length+'</span><button class="iconbtn" data-a="cook-toggle-auto" title="Auto-advance">'+(c.auto?ic('check',18):ic('play',14))+'</button></div>';
  h+='<div class="cook-prog"><div class="cook-prog-f" style="width:'+pct+'%"></div></div>';
  h+='<div class="cook-stage" id="cook-stage">';
  h+='<div class="cook-e">Step '+(c.idx+1)+' of '+r.steps.length+(c.auto?' · auto':' · manual')+'</div>';
  h+='<div class="cook-t">'+esc(step.text)+'</div>';
  h+='<div class="cook-countdown"><div class="cook-countdown-num">'+fmtTime(remaining)+'</div><div class="cook-countdown-lbl">'+(c.running?'remaining':'paused')+'</div></div>';
  if(sub)h+='<div class="cook-sub"><div class="cook-sub-l">Substitution</div><div class="cook-sub-t">'+sub+'</div></div>';
  h+='<div class="cook-hint">Tap to pause · swipe to move between steps</div>';
  if(c.advanceIn>0)h+='<div class="cook-overlay"><div class="cook-overlay-s">Next in</div><div class="cook-overlay-t">'+c.advanceIn+'</div><button class="btn" style="background:var(--paper);color:var(--ink);margin-top:8px" data-a="cook-cancel-advance">Hold on</button></div>';
  h+='</div>';
  h+='<div class="cook-controls">';
  h+='<button class="cook-control-sq" data-a="cook-prev" '+(c.idx===0?'disabled style="opacity:.3"':'')+'>'+ic('chev-l',28)+'</button>';
  h+='<button class="cook-control-big '+(!c.running?'paused':'')+'" data-a="cook-pause">'+(c.running?ic('pause',26):ic('play',26))+' '+(c.running?'Pause':'Play')+'</button>';
  h+='<button class="cook-control-sq" data-a="'+(isLast?'cook-finish':'cook-next')+'">'+(isLast?ic('check',28):ic('chev-r',28))+'</button>';
  h+='</div></div>';
  return h;
}

function updateCookTimerDOM(){
  const c=S.cook;if(!c.recipe)return;
  const step=c.recipe.steps[c.idx];const total=step.duration||60;
  const num=document.querySelector('.cook-countdown-num');if(num)num.textContent=fmtTime(c.remaining);
  const lbl=document.querySelector('.cook-countdown-lbl');if(lbl)lbl.textContent=c.running?'remaining':'paused';
  const prog=document.querySelector('.cook-prog-f');if(prog)prog.style.width=Math.max(0,Math.min(100,((total-c.remaining)/total)*100))+'%';
}
function renderCookOnly(){renderFullscreenOnly()}
function renderFullscreenOnly(){
  const fs=document.querySelector('.fullscreen');if(!fs)return render();
  const temp=document.createElement('div');temp.innerHTML=renderFullscreen();
  const newFs=temp.firstElementChild;if(!newFs)return;
  // Preserve the outer .fullscreen element to avoid re-triggering its CSS animation.
  // Swap only the inner contents.
  fs.innerHTML=newFs.innerHTML;
  // Keep class list in sync in case fullscreen type changed styling
  fs.className=newFs.className;
  fs.querySelectorAll('[data-a]').forEach(el=>{
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){el.addEventListener('input',handleInput);el.addEventListener('change',handleInput);el.addEventListener('click',e=>e.stopPropagation())}
    else el.addEventListener('click',handleAction);
  });
  bindCook();
}
function cookTick(){
  const c=S.cook;if(!c.running)return;
  c.remaining--;
  if(c.remaining<=0){
    clearInterval(c.interval);c.interval=null;c.remaining=0;
    if(c.auto&&c.idx<c.recipe.steps.length-1){
      c.advanceIn=3;
      c.advTimer=setInterval(()=>{c.advanceIn--;if(c.advanceIn<=0){clearInterval(c.advTimer);c.advTimer=null;cookNext()}else renderCookOnly()},1000);
      renderCookOnly();return;
    }else if(c.idx>=c.recipe.steps.length-1){c.running=false;c.justFinished=true;renderCookOnly();return}
    else {c.running=false;renderCookOnly();return}
  }
  updateCookTimerDOM();
}
function cookNext(){const c=S.cook;if(c.idx>=c.recipe.steps.length-1)return cookFinish();if(c.advTimer){clearInterval(c.advTimer);c.advTimer=null;c.advanceIn=0}c.idx++;const step=c.recipe.steps[c.idx];c.remaining=step.duration||60;if(c.auto){c.running=true;if(c.interval)clearInterval(c.interval);c.interval=setInterval(cookTick,1000)}else c.running=false;renderCookOnly()}
function cookPrev(){const c=S.cook;if(c.idx===0)return;if(c.advTimer){clearInterval(c.advTimer);c.advTimer=null;c.advanceIn=0}c.idx--;const step=c.recipe.steps[c.idx];c.remaining=step.duration||60;if(c.auto){c.running=true;if(c.interval)clearInterval(c.interval);c.interval=setInterval(cookTick,1000)}else c.running=false;renderCookOnly()}
function cookPause(){const c=S.cook;if(c.advTimer){clearInterval(c.advTimer);c.advTimer=null;c.advanceIn=0;c.running=false;renderCookOnly();return}c.running=!c.running;if(c.running){if(!c.remaining)c.remaining=c.recipe.steps[c.idx].duration||60;if(c.interval)clearInterval(c.interval);c.interval=setInterval(cookTick,1000)}else if(c.interval){clearInterval(c.interval);c.interval=null}renderCookOnly()}
function cookFinish(){const c=S.cook;if(c.interval)clearInterval(c.interval);if(c.advTimer)clearInterval(c.advTimer);const id=c.recipe.id;S.interactions[id]={status:'cooked',cooked_at:Date.now()};S.shopping.forEach(s=>{if(s.recipe_id===id)s.checked=true});S.rvRecipe=c.recipe;S.rvPhase='rating';S.rvPots=0;S.rvNotes='';S.rvPublic=true;S.cook={recipe:null,idx:0,remaining:0,running:false,interval:null,auto:false,advanceIn:0,advTimer:null,justFinished:false};S.fullscreen={type:'review-flow'};render()}
function cookOpen(id){const r=findRecipe(id);if(!r)return;if(S.cook.interval)clearInterval(S.cook.interval);if(S.cook.advTimer)clearInterval(S.cook.advTimer);S.cook={recipe:r,idx:0,remaining:r.steps[0].duration||60,running:true,interval:null,auto:true,advanceIn:0,advTimer:null,justFinished:false};S.cook.interval=setInterval(cookTick,1000);S.fullscreen={type:'cook'};render()}

function bindCook(){
  const stage=document.getElementById('cook-stage');if(!stage)return;
  let sx=0,sy=0,active=false,moved=false;
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('[data-a]'))return;active=true;moved=false;sx=e.clientX;sy=e.clientY});
  stage.addEventListener('pointermove',e=>{if(!active)return;if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)moved=true});
  stage.addEventListener('pointerup',e=>{if(!active)return;active=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(moved&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){if(dx<0){if(S.cook.idx>=S.cook.recipe.steps.length-1)cookFinish();else cookNext()}else cookPrev()}else if(!moved){cookPause()}});
}

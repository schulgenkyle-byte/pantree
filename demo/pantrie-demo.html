/* ========= TOAST + RENDER ENGINE ========= */
function renderToast(){const t=S.toast;return'<div class="toast"><span>'+esc(t.msg)+'</span>'+(t.action?'<button data-a="'+t.action+'">'+esc(t.label)+'</button>':'')+'</div>'}
function showToast(msg,opts){S.toast={msg,label:opts?.label,action:opts?.action};setTimeout(()=>{if(S.toast&&S.toast.msg===msg){S.toast=null;render()}},3500)}

function bindAll(){
  document.querySelectorAll('[data-a]').forEach(el=>{
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){el.addEventListener('input',handleInput);el.addEventListener('change',handleInput);el.addEventListener('click',e=>e.stopPropagation())}
    else el.addEventListener('click',handleAction);
  });
  bindDeck();
  bindCook();
  bindDrag();
}

function bindDrag(){
  document.querySelectorAll('.drag-row').forEach(row=>{
    row.addEventListener('dragstart',e=>{S.dragId=row.dataset.id;row.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',row.dataset.id)}catch(_){}});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');document.querySelectorAll('.drag-row').forEach(r=>r.classList.remove('drag-over'));S.dragId=null});
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over')});
    row.addEventListener('dragleave',()=>{row.classList.remove('drag-over')});
    row.addEventListener('drop',e=>{e.preventDefault();const srcId=S.dragId;const tgtId=row.dataset.id;const colId=row.dataset.col;if(!srcId||!tgtId||srcId===tgtId||!colId)return;const col=findCollection(colId);if(!col)return;const si=col.recipe_ids.indexOf(srcId),ti=col.recipe_ids.indexOf(tgtId);if(si<0||ti<0)return;col.recipe_ids.splice(si,1);col.recipe_ids.splice(ti,0,srcId);render()});
  });
}

function handleInput(e){
  const el=e.currentTarget;const a=el.dataset.a;const d=el.dataset;
  if(a==='update-setting'){S.settings[d.k]=el.value;if(d.k==='name')S.settings.initials=(el.value||' ').trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()).slice(0,2).join('')||'?'}
  else if(a==='edit-recipe'){const v=el.type==='number'?parseFloat(el.value)||0:el.value;S.recipeEditor[d.k]=v}
  else if(a==='edit-ing'){S.recipeEditor.ingredients[parseInt(d.i)][d.k]=el.value}
  else if(a==='edit-step'){S.recipeEditor.steps[parseInt(d.i)].text=el.value}
}

function handleAction(e){
  const el=e.currentTarget;const a=el.dataset.a;const d={};for(const k in el.dataset)d[k]=el.dataset[k];
  e.stopPropagation();

  if(a==='route'){S.route=d.r;S.sheet=null;S.fullscreen=null;render();return}
  if(a==='close-sheet'){S.sheet=null;render();return}
  if(a==='close-fs'){S.fullscreen=null;if(S.cook.interval){clearInterval(S.cook.interval);S.cook.interval=null}if(S.cook.advTimer){clearInterval(S.cook.advTimer);S.cook.advTimer=null;S.cook.advanceIn=0}render();return}

  if(a==='open-recipe'){const r=findRecipe(d.id);if(r)S.sheet={type:'recipe',recipe:r};render();return}
  if(a==='open-scan'){S.fullscreen={type:'scan'};render();return}
  if(a==='scan-simulate'){const items=[{name:'Red bell pepper',category:'produce',quantity:2,unit:'count'},{name:'Feta cheese',category:'dairy',quantity:4,unit:'oz'},{name:'Baby spinach',category:'produce',quantity:1,unit:'bag'}];items.forEach(i=>S.pantry.push({id:uid('p'),...i}));S.lastScanAt=Date.now();S.scanNudgeDismissedAt=Date.now();S.fullscreen=null;showToast('Added 3 items · pantry refreshed');render();return}
  if(a==='dismiss-scan-nudge'){S.scanNudgeDismissedAt=Date.now();render();return}
  if(a==='open-add-item'){S.sheet={type:'add-item'};render();return}
  if(a==='confirm-add'){const name=document.getElementById('add-name')?.value?.trim();const qty=parseFloat(document.getElementById('add-qty')?.value)||null;const unit=document.getElementById('add-unit')?.value?.trim()||null;const cat=document.getElementById('add-cat')?.value||'other';if(!name)return;S.pantry.unshift({id:uid('p'),name,quantity:qty,unit,category:cat});S.sheet=null;showToast('Added');render();return}
  if(a==='open-add-shop'){S.sheet={type:'add-shop'};render();return}
  if(a==='confirm-add-shop'){const name=document.getElementById('sa-name')?.value?.trim();const qty=parseFloat(document.getElementById('sa-qty')?.value)||null;const unit=document.getElementById('sa-unit')?.value?.trim()||null;const aisle=document.getElementById('sa-aisle')?.value||'other';if(!name)return;S.shopping.push({id:uid('s'),name,quantity:qty,unit,aisle,checked:false,source:'manual'});S.sheet=null;showToast('Added');render();return}

  if(a==='swipe'){commitSwipe(d.d);return}
  if(a==='flip-card'){S.flipped=!S.flipped;render();return}
  if(a==='undo-swipe'){const last=S.deckHist.pop();if(last){delete S.interactions[last.id];if(last.addedShopIds)S.shopping=S.shopping.filter(s=>!last.addedShopIds.includes(s.id))}S.toast=null;S.flipped=false;render();return}
  if(a==='open-why-not'){const id=S.lastDismissedId;const r=findRecipe(id);if(r){S.sheet={type:'dismiss-reason',recipe:r};S.toast=null}render();return}
  if(a==='reset-deck'){S.interactions={};S.deckHist=[];S.flipped=false;S.route='deck';render();return}
  if(a==='reset-all'){S.interactions={};S.deckHist=[];S.reviews=[];S.planDraft=[];S.planCommitted=false;S.weekPlan=emptyWeekPlan();S.shopping=[{id:'s1',name:'Lemon',quantity:2,unit:'count',aisle:'produce',checked:false,source:'manual'}];S.my_recipes=[];S.collections=[{id:'c1',name:'Weeknight staples',recipe_ids:[]},{id:'c2',name:'Date night',recipe_ids:[]}];showToast('Reset');render();return}
  if(a==='dismiss-cancel'){S.sheet=null;render();return}
  if(a==='dismiss-confirm'){const reason=d.reason||null;const id=S.lastDismissedId;if(id&&S.interactions[id])S.interactions[id].dismiss_reason=reason;S.sheet=null;showToast(reason?'Thanks — got it':'Skipped');render();return}

  if(a==='set-shop-tab'){S.shopTab=d.t;render();return}
  if(a==='plan-toggle'){const id=d.id;const idx=S.planDraft.indexOf(id);if(idx>=0){S.planDraft.splice(idx,1);if(S.interactions[id]?.status==='planned')delete S.interactions[id]}else S.planDraft.push(id);render();return}
  if(a==='plan-clear'){S.planDraft=[];render();return}
  if(a==='plan-review'){S.fullscreen={type:'plan-review'};render();return}
  if(a==='plan-back'){S.fullscreen=null;render();return}

  if(a==='slot-pick'){S.slotPicker={day:parseInt(d.day),slot:d.slot,replacing:null};S.sheet={type:'slot-pick'};render();return}
  if(a==='slot-open'){S.slotPicker={day:parseInt(d.day),slot:d.slot};S.sheet={type:'slot-action'};render();return}
  if(a==='slot-assign'){
    const {day,slot}=S.slotPicker;const rid=d.id;const r=findRecipe(rid);
    setSlot(day,slot,rid);
    // Auto-add missing ingredients to shopping list
    const items=shopForRecipes([rid]);let added=0;
    items.forEach(it=>{if(S.shopping.find(s=>s.name.toLowerCase()===it.name.toLowerCase()))return;const q=it.items[0];S.shopping.push({id:uid('s'),name:it.name,quantity:q.quantity,unit:q.unit,aisle:it.aisle,checked:false,source:'plan',recipe_id:rid});added++});
    S.sheet=null;S.slotPicker=null;
    showToast(esc(r.title)+' added to '+DAYS[day]+(added?' · '+added+' to list':''));
    render();return;
  }
  if(a==='slot-swap'){S.slotPicker={day:parseInt(d.day),slot:d.slot,replacing:d.id};S.sheet={type:'slot-pick'};render();return}
  if(a==='slot-clear'){const day=parseInt(d.day);const slot=d.slot;const rid=S.weekPlan[day][slot];clearSlot(day,slot);if(rid&&!isPlanned(rid)){S.shopping=S.shopping.filter(s=>s.recipe_id!==rid||s.checked)}S.sheet=null;S.slotPicker=null;showToast('Removed from plan');render();return}
  if(a==='start-cook-slot'){S.sheet=null;cookOpen(d.id);return}
  if(a==='scroll-to-day'){const el=document.getElementById('day-'+d.d);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='clear-week'){S.weekPlan=emptyWeekPlan();S.shopping=S.shopping.filter(s=>s.source!=='plan');showToast('Week cleared');render();return}

  if(a==='plan-commit'){const items=shopForRecipes(S.planDraft);items.forEach(it=>{const q=it.items[0];S.shopping.push({id:uid('s'),name:it.name,quantity:q.quantity,unit:q.unit,aisle:it.aisle,checked:false,source:'plan',recipe_id:q.recipe_id})});S.planDraft.forEach(id=>{S.interactions[id]={status:'planned',planned_at:Date.now()}});S.planDraft=[];S.planCommitted=true;S.fullscreen=null;S.shopTab='list';showToast('Plan locked in');render();return}
  if(a==='plan-add'){const id=d.id;const today=todayIdx();let placed=false;for(let off=0;off<7&&!placed;off++){const di=(today+off)%7;if(!S.weekPlan[di].dinner){setSlot(di,'dinner',id);placed=true}}const r=findRecipe(id);const items=shopForRecipes([id]);items.forEach(it=>{if(S.shopping.find(s=>s.name.toLowerCase()===it.name.toLowerCase()))return;const q=it.items[0];S.shopping.push({id:uid('s'),name:it.name,quantity:q.quantity,unit:q.unit,aisle:it.aisle,checked:false,source:'plan',recipe_id:id})});S.sheet=null;showToast('Added '+r.title+' to plan');render();return}
  if(a==='plan-edit'){S.shopTab='menu';render();return}
  if(a==='add-sugg'){S.shopping.push({id:uid('s'),name:d.name,quantity:parseFloat(d.qty),unit:d.unit,aisle:d.aisle,checked:false,source:'suggestion'});showToast('Added '+d.name);render();return}
  if(a==='add-reco'){S.shopping.push({id:uid('s'),name:d.name,quantity:1,unit:d.unit||null,aisle:d.aisle,checked:false,source:'suggestion'});showToast('Added '+d.name+' · new recipes unlocked');render();return}
  if(a==='toggle-shop'){const it=S.shopping.find(s=>s.id===d.id);if(!it)return;const wasChecked=it.checked;it.checked=!it.checked;if(it.checked&&!wasChecked){const existing=S.pantry.find(p=>p.name.toLowerCase()===it.name.toLowerCase());if(existing){if(it.quantity)existing.quantity=(existing.quantity||0)+it.quantity}else{S.pantry.push({id:uid('p'),name:it.name,quantity:it.quantity||1,unit:it.unit||null,category:it.aisle||'other'})}showToast(it.name+' added to pantry',{label:'Undo',action:'undo-check-shop',data:it.id})}render();return}
  if(a==='undo-check-shop'){const it=S.shopping.find(s=>s.id===S.toast?.data);if(it){it.checked=false;S.pantry=S.pantry.filter(p=>!(p.name.toLowerCase()===it.name.toLowerCase()&&!p.expires_at&&p.id.startsWith('p_')))}S.toast=null;render();return}
  if(a==='expiring-restock'){const p=S.pantry.find(x=>x.id===d.id);if(!p)return;const exists=S.shopping.find(s=>s.name.toLowerCase()===p.name.toLowerCase()&&!s.checked);if(exists){S.shopping=S.shopping.filter(s=>s!==exists);showToast('Removed from list')}else{S.shopping.push({id:uid('s'),name:p.name,quantity:p.quantity||1,unit:p.unit,aisle:p.category||'other',checked:false,source:'restock'});showToast(p.name+' added to list')}render();return}
  if(a==='expiring-cook'){const p=S.pantry.find(x=>x.id===d.id);if(!p)return;const matching=allRecipes().filter(r=>r.ingredients.some(i=>i.name.toLowerCase()===p.name.toLowerCase()));if(matching.length){S.sheet={type:'recipes-using',item:p,recipes:matching}}render();return}
  if(a==='pantry-edit'){const item=S.pantry.find(p=>p.id===d.id);if(item){S.sheet={type:'pantry-edit',item}}render();return}
  if(a==='pantry-save-edit'){const item=S.pantry.find(p=>p.id===d.id);if(!item)return;item.name=document.getElementById('pe-name')?.value?.trim()||item.name;const q=parseFloat(document.getElementById('pe-qty')?.value);item.quantity=isNaN(q)?null:q;item.unit=document.getElementById('pe-unit')?.value?.trim()||null;item.category=document.getElementById('pe-cat')?.value||'other';const ex=document.getElementById('pe-exp')?.value;item.expires_at=ex||null;S.sheet=null;showToast('Saved');render();return}
  if(a==='pantry-delete'){S.pantry=S.pantry.filter(p=>p.id!==d.id);S.sheet=null;showToast('Removed');render();return}
  if(a==='clear-checked'){S.shopping=S.shopping.filter(s=>!s.checked);render();return}

  if(a==='start-cook'){S.sheet=null;cookOpen(d.id);return}
  if(a==='start-cook-direct'){cookOpen(d.id);return}
  if(a==='cook-again'){cookOpen(d.id);return}
  if(a==='cook-prev'){cookPrev();return}
  if(a==='cook-next'){cookNext();return}
  if(a==='cook-pause'){cookPause();return}
  if(a==='cook-finish'){cookFinish();return}
  if(a==='cook-toggle-auto'){S.cook.auto=!S.cook.auto;if(!S.cook.auto){S.cook.running=false;if(S.cook.interval){clearInterval(S.cook.interval);S.cook.interval=null}}else{if(!S.cook.running){S.cook.running=true;if(!S.cook.remaining)S.cook.remaining=S.cook.recipe.steps[S.cook.idx].duration||60;S.cook.interval=setInterval(cookTick,1000)}}renderCookOnly();return}
  if(a==='cook-cancel-advance'){if(S.cook.advTimer){clearInterval(S.cook.advTimer);S.cook.advTimer=null}S.cook.advanceIn=0;S.cook.running=false;renderCookOnly();return}

  if(a==='rv-set'){S.rvPots=parseInt(d.n);renderFullscreenOnly();return}

  if(a==='set-mine-tab'){S.mineTab=d.t;render();return}
  if(a==='set-portfolio-tab'){S.portfolioTab=d.t;render();return}
  if(a==='set-feed-tab'){S.feedTab=d.t;render();return}

  if(a==='view-profile'){if(d.id==='me'){S.route='settings';S.sheet=null;render();return}S.viewingProfile=d.id;S.route='profile';S.sheet=null;render();return}

  if(a==='review-menu'){S.sheet={type:'review-menu',data:{id:d.id,user_id:d.user}};render();return}

  if(a==='toggle-setting'){S.settings[d.k]=!S.settings[d.k];render();return}

  if(a==='stepper'){const delta=parseInt(d.d);S.settings[d.k]=Math.max(1,Math.min(12,S.settings[d.k]+delta));render();return}
  if(a==='open-pref'){S.sheet={type:'pref',key:d.k};render();return}
  if(a==='set-pref'){let v=d.v;if(d.k==='max_cook_time'||d.k==='household_size')v=parseInt(v);S.settings[d.k]=v;S.sheet=null;render();return}
  if(a==='export-data'){showToast('Data export prepared (demo)');return}

  if(a==='open-new-recipe'){S.recipeEditor=null;S.fullscreen={type:'new-recipe'};render();return}
  if(a==='open-import-url'){S.fullscreen={type:'import-url'};render();return}
  if(a==='import-url-run'){const u=document.getElementById('imp-url')?.value?.trim();if(!u)return;const sim={id:uid('mr'),title:'Imported Recipe',cuisine:'Other',description:'Auto-extracted from '+u.substring(0,30)+'...',servings:4,prep_minutes:15,cook_minutes:25,uses_pantry_percent:60,avg_rating:0,total_ratings:0,cook_count:0,cost_per_serving:null,dietary_flags:[],allergen_warnings:[],ingredients:[{name:'See source link',have:false,aisle:'other'}],steps:[{order:1,text:'Visit the source URL for full steps.',duration:null}],skill_level:'beginner'};S.my_recipes.push(sim);S.fullscreen=null;showToast('Imported from URL (demo)');render();return}

  if(a==='open-smart-planner'){S.smartPlan=null;S.fullscreen={type:'smart-planner'};render();return}
  if(a==='close-smart-planner'){S.smartPlan=null;S.fullscreen=null;render();return}
  if(a==='planner-toggle'){const sel=S.smartPlan.selected;if(sel.has(d.id))sel.delete(d.id);else sel.add(d.id);renderFullscreenOnly();return}
  if(a==='planner-commit'){const sel=S.smartPlan.selected;if(!sel.size)return;const ids=[...sel];const today=todayIdx();let placed=0;let addedShop=0;ids.forEach(id=>{for(let off=0;off<7;off++){const di=(today+off)%7;if(!S.weekPlan[di].dinner){setSlot(di,'dinner',id);placed++;const items=shopForRecipes([id]);items.forEach(it=>{if(S.shopping.find(s=>s.name.toLowerCase()===it.name.toLowerCase()))return;const q=it.items[0];S.shopping.push({id:uid('s'),name:it.name,quantity:q.quantity,unit:q.unit,aisle:it.aisle,checked:false,source:'plan',recipe_id:id});addedShop++});return}}});S.smartPlan=null;S.fullscreen=null;S.shopTab='menu';showToast('Planned '+placed+' dinner'+(placed===1?'':'s')+' · '+addedShop+' to list');render();return}
  if(a==='add-ing'){S.recipeEditor.ingredients.push({name:'',quantity:'',unit:''});renderFullscreenOnly();return}
  if(a==='rm-ing'){S.recipeEditor.ingredients.splice(parseInt(d.i),1);if(!S.recipeEditor.ingredients.length)S.recipeEditor.ingredients.push({name:'',quantity:'',unit:''});renderFullscreenOnly();return}
  if(a==='add-step'){S.recipeEditor.steps.push({text:''});renderFullscreenOnly();return}
  if(a==='rm-step'){S.recipeEditor.steps.splice(parseInt(d.i),1);if(!S.recipeEditor.steps.length)S.recipeEditor.steps.push({text:''});renderFullscreenOnly();return}
  if(a==='save-new-recipe'){const r=S.recipeEditor;if(!r.title.trim()){showToast('Give it a name first');return}const validIngs=r.ingredients.filter(i=>i.name.trim()).map((i,idx)=>({name:i.name,quantity:parseFloat(i.quantity)||null,unit:i.unit,have:false,aisle:'other'}));const validSteps=r.steps.filter(s=>s.text.trim()).map((s,idx)=>({order:idx+1,text:s.text,duration:60}));const full={id:uid('mr'),title:r.title,cuisine:r.cuisine,description:r.description||'A recipe from your catalog.',servings:parseInt(r.servings)||2,prep_minutes:parseInt(r.prep_minutes)||10,cook_minutes:parseInt(r.cook_minutes)||20,ingredients:validIngs,steps:validSteps,uses_pantry_percent:50,avg_rating:0,total_ratings:0,cook_count:0,cost_per_serving:null,dietary_flags:[],allergen_warnings:[],skill_level:'beginner'};S.my_recipes.push(full);S.recipeEditor=null;S.fullscreen=null;showToast('Recipe saved');render();return}

  if(a==='open-collection'){S.viewingCollection=d.id;S.route='collection';render();return}
  if(a==='new-collection'){S.sheet={type:'new-coll',from_recipe:null};render();return}
  if(a==='confirm-new-collection'){const name=document.getElementById('coll-name')?.value?.trim();if(!name)return;const from=el.dataset.from;const c={id:uid('c'),name,recipe_ids:from?[from]:[]};S.collections.push(c);S.sheet=null;showToast('Collection created');render();return}
  if(a==='open-add-to-coll'){S.sheet={type:'add-to-coll',recipe_id:d.id};render();return}
  if(a==='coll-add-from-sheet'){const col=findCollection(d.col);if(col&&!col.recipe_ids.includes(d.id))col.recipe_ids.push(d.id);else if(col){const i=col.recipe_ids.indexOf(d.id);if(i>=0)col.recipe_ids.splice(i,1)}render();return}
  if(a==='new-coll-from-sheet'){S.sheet={type:'new-coll',from_recipe:d.id};render();return}
  if(a==='collection-add'){const col=findCollection(d.col);if(col&&!col.recipe_ids.includes(d.id))col.recipe_ids.push(d.id);render();return}
  if(a==='collection-remove'){const col=findCollection(d.col);if(col){const i=col.recipe_ids.indexOf(d.id);if(i>=0)col.recipe_ids.splice(i,1)}render();return}
  if(a==='collection-rename'){const c=findCollection(d.id);if(!c)return;const name=prompt('Rename collection',c.name);if(name&&name.trim()){c.name=name.trim();render()}return}
}

render();
</script>
</body>
</html>

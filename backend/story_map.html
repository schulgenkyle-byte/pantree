<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mystery Nights — Story Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --paper:   #F2EBDE;
    --paper2:  #ECE3D2;
    --paper3:  #E4D7BE;
    --paper4:  #DCCFB3;
    --ink:     #2A2520;
    --inkSoft: #5A4F45;
    --inkFaint:#8B7F73;
    --rule:    #BFB099;
    --brass:   #B07A2C;
    --brassDeep:#7A5320;
    --terra:   #B14E2C;
    --mono:    'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --serif:   'Source Serif Pro', 'Iowan Old Style', Georgia, serif;
    --display: 'Playfair Display', 'Iowan Old Style', Georgia, serif;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { background: var(--paper); color: var(--ink); font-family: var(--serif); margin:0; }
  body { padding: 20px 24px 60px; max-width: 1500px; margin: 0 auto; }
  h1 { font-family: var(--display); font-style: italic; font-weight: 500; margin: 0 0 6px 0; font-size: 30px; }
  .sub { color: var(--inkFaint); font-style: italic; font-size: 14px; margin-bottom: 18px; }
  .mono-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 2.4px; color: var(--brass); text-transform: uppercase; }

  .picker {
    display: flex; gap: 0; flex-wrap: wrap; background: var(--paper2);
    border-bottom: 1px solid var(--rule); margin-bottom: 22px;
    position: sticky; top: 0; z-index: 50; padding-top: 6px;
  }
  .picker button {
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    padding: 10px 14px; cursor: pointer; font-family: var(--serif); font-size: 14px;
    color: var(--inkSoft); font-style: italic;
  }
  .picker button.active { color: var(--ink); border-bottom-color: var(--terra); font-weight: 600; }
  .picker button .meta { color: var(--inkFaint); font-size: 11px; margin-left: 6px; font-style: normal; }

  .mystery-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 14px; }
  .mystery-header h2 { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 28px; margin: 0; }
  .mystery-header .where { color: var(--inkFaint); font-style: italic; font-size: 14px; }
  .mystery-header .range {
    margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--terra); background: var(--paper3); padding: 4px 8px; border-radius: 2px;
  }

  .body-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; }
  @media (max-width: 1050px) { .body-grid { grid-template-columns: 1fr; } }

  /* Timeline */
  .timeline { position: relative; }
  .beat {
    position: relative; padding: 12px 14px 12px 60px; background: var(--paper2);
    border: 0.5px solid var(--rule); border-radius: 4px; margin-bottom: 10px;
  }
  .beat::before {
    content: attr(data-time); position: absolute; left: 8px; top: 12px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 1px; color: var(--brassDeep);
    width: 44px; text-align: right;
  }
  .beat .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .beat .kind {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px; padding: 2px 6px;
    border-radius: 2px; background: var(--paper3); color: var(--brassDeep);
  }
  .beat.twist { border-color: var(--terra); background: #F6EEDB; }
  .beat.twist .kind { background: var(--terra); color: var(--paper); }
  .beat.reveal { border: 1px solid var(--brassDeep); background: #F1E6CC; }
  .beat.reveal .kind { background: var(--brassDeep); color: var(--paper); }
  .beat.system { background: var(--paper); border-style: dashed; }
  .beat.system .kind { background: var(--inkSoft); color: var(--paper); }
  .beat .target {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1.4px; color: var(--inkSoft);
  }
  .beat.optional { border-style: dashed; }
  .beat.optional .optional-tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1.4px; color: var(--brass);
    background: var(--paper); padding: 2px 5px; border-radius: 2px; margin-left: auto;
  }
  .beat .body { font-size: 14px; line-height: 19px; color: var(--ink); }
  .beat .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .beat .actions span {
    font-family: var(--serif); font-size: 12px; color: var(--ink); padding: 3px 8px;
    background: var(--paper); border: 0.5px solid var(--brass); border-radius: 2px; font-style: italic;
  }

  /* Cast (sticky aside) */
  .cast { position: sticky; top: 70px; align-self: start; max-height: calc(100vh - 90px); overflow-y: auto; }
  .cast h3 { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 18px; margin: 0 0 8px 0; }
  .character {
    background: var(--paper2); border: 0.5px solid var(--rule); border-radius: 3px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .character.core { border-left: 3px solid var(--terra); }
  .character.optional { border-left: 3px dotted var(--brass); opacity: 0.92; }
  .character .who { font-family: var(--display); font-style: italic; font-size: 15px; color: var(--ink); }
  .character .who .killer-tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px; color: var(--paper);
    background: var(--terra); padding: 1px 5px; border-radius: 2px; margin-left: 6px;
    font-style: normal;
  }
  .character .who .optional-tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px; color: var(--brass);
    background: var(--paper3); padding: 1px 5px; border-radius: 2px; margin-left: 6px;
    font-style: normal;
  }
  .character .lbl { font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px; color: var(--brass); margin-top: 6px; }
  .character .role { font-size: 11.5px; line-height: 15px; color: var(--inkSoft); margin-top: 2px; }
  .character .agenda { font-size: 11.5px; line-height: 15px; color: var(--ink); margin-top: 2px; }
  .character .secret { font-size: 11.5px; line-height: 15px; color: var(--terra); font-style: italic; margin-top: 2px; }

  /* Reveal */
  .reveal-panel {
    background: #F1E6CC; border: 1px solid var(--brassDeep); border-radius: 4px;
    padding: 18px 20px; margin-top: 18px;
  }
  .reveal-panel h3 { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; color: var(--brassDeep); margin: 0 0 6px 0; }
  .reveal-panel .killer-line { font-family: var(--display); font-style: italic; font-size: 22px; margin-bottom: 12px; color: var(--ink); }
  .reveal-panel .reveal-text { font-size: 14px; line-height: 22px; color: var(--ink); white-space: pre-wrap; }

  /* Story-coherence callouts (manual annotations) */
  .threads { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--rule); }
  .threads h4 { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--brass); margin: 0 0 6px 0; }
  .threads ul { margin: 0; padding-left: 18px; font-size: 12px; line-height: 18px; color: var(--inkSoft); }
  .threads ul li { margin-bottom: 2px; }
  .threads ul li b { color: var(--ink); font-weight: 600; }

  /* Suspicion ledger */
  .suspicion {
    background: var(--paper3); border: 0.5px solid var(--rule); border-radius: 3px;
    padding: 12px 14px; margin-top: 12px;
  }
  .suspicion h4 { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--brass); margin: 0 0 8px 0; }
  .suspicion .row { display: flex; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .suspicion .row .name { font-family: var(--display); font-style: italic; min-width: 130px; }
  .suspicion .row .verdict { color: var(--inkSoft); }
  .suspicion .row .verdict.killer { color: var(--terra); font-weight: 600; }

  .covers { margin-top: 14px; }
  .covers h3 { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--brass); margin: 0 0 6px 0; }
  .covers ul { columns: 2; padding-left: 16px; font-size: 11.5px; color: var(--inkSoft); font-style: italic; margin: 0; }
  .covers ul li { margin-bottom: 2px; break-inside: avoid; }
</style>
</head>

      { id: 'the_playwright', name: 'The Playwright', role: 'A successful Broadway author. Had a play savaged by the dead man six months ago.', secret: 'You returned to the hotel at midnight and saw the dead man arguing with someone in the lobby.', objective: 'Find out who else was in the lobby last night. Keep your name out of whatever the table decides.', optional: false },

      { t: 90, kind: 'REVEAL', target: 'all', body: 'It was the Visiting Author.\n\nTwelve years ago in London, the dead man — under a different name — had blackmailed her over a manuscript she had submitted under her sister\'s identity. She had paid him quarterly for a decade. When she heard he was coming to New York to retire, she came to confront him. She offered him the resignation letter, written under coercion, as a final clean-out. When he refused to leave town quietly, she returned to his room after dinner.\n\nThe lapel pin was hers. The whispered conversation the Matron overheard was him refusing the offer. The Editor was about to fire a man who was about to vanish anyway. The Playwright saw her in the lobby at midnight, returning from his room. The Actress\'s chain of reasoning about the producer\'s wife is correct: the Visiting Author had every opportunity.\n\nIt was twelve years overdue.' },

const picker = document.getElementById('picker');
const mountEl = document.getElementById('mystery');
let active = MYSTERIES[0].id;

function init() {
  for (const m of MYSTERIES) {
    const b = document.createElement('button');
    b.dataset.id = m.id;
    b.innerHTML = `${m.title} <span class="meta">${m.city} · ${m.era}</span>`;
    b.addEventListener('click', () => { active = m.id; render(); });
    picker.appendChild(b);
  }
  render();
}

function render() {
  picker.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.id === active));
  const m = MYSTERIES.find(x => x.id === active);
  if (!m) return;
  const castById = new Map(m.cast.map(c => [c.id, c]));
  const charName = (id) => id === 'all' ? 'ALL' : (castById.get(id)?.name || id);

  mountEl.innerHTML = `
    <div class="mystery-header">
      <h2>${escapeHtml(m.title)}</h2>
      <span class="where">${escapeHtml(m.where)}</span>
      <span class="range">${escapeHtml(m.range)}</span>
    </div>
    <div class="body-grid">
      <div>
        <div class="mono-eyebrow" style="margin-bottom:8px;">Timeline · ${m.beats.length} beats</div>
        <div class="timeline">
          ${m.beats.map(beat => renderBeat(beat, charName)).join('')}
        </div>
      </div>
      <aside class="cast">
        <h3>Cast (${m.cast.length})</h3>
        <div class="mono-eyebrow" style="margin-bottom:8px;">Core · the reveal needs them. Optional · scale-up flavor.</div>
        ${m.cast.map(c => renderCharacter(c, m.killer)).join('')}
        <div class="suspicion">
          <h4>Suspect Tracker</h4>
          ${m.suspicion.map(s => `
            <div class="row">
              <span class="name">${escapeHtml(charName(s.id))}</span>
              <span class="verdict ${s.id === m.killer ? 'killer' : ''}">${escapeHtml(s.verdict)}</span>
            </div>`).join('')}
        </div>
        <div class="covers">
          <h3>Cover-beat library</h3>
          <div style="font-size:11.5px;color:var(--inkFaint);font-style:italic;">${m.covers_count} period-flavored throwaway lines fire to every non-target player on each TWIST so observers cannot pattern-match.</div>
        </div>
      </aside>
    </div>
    <div class="reveal-panel">
      <h3>THE REVEAL</h3>
      <div class="killer-line">It was ${escapeHtml(charName(m.killer))}.</div>
      <div class="reveal-text">${escapeHtml(m.beats.find(b => b.kind === 'REVEAL')?.body || '').replace(/\n/g,'<br>')}</div>
      <div class="threads">
        <h4>STORY THREADS · How the reveal is set up by the beats above</h4>
        <ul>${m.threads.map(t => `<li>${formatThread(t)}</li>`).join('')}</ul>
      </div>
    </div>
  `;
}

function renderBeat(beat, charName) {
  const cls = ['beat', (beat.kind || '').toLowerCase()].join(' ');
  const opt = beat.optional ? 'optional' : '';
  if (beat.kind === 'REVEAL') return ''; // shown in reveal panel
  return `
    <div class="${cls} ${opt}" data-time="T+${beat.t}">
      <div class="head">
        <span class="kind">${escapeHtml(beat.kind)}</span>
        <span class="target">→ ${escapeHtml(charName(beat.target).toUpperCase())}</span>
        ${beat.optional ? '<span class="optional-tag">OPTIONAL</span>' : ''}
      </div>
      <div class="body">${escapeHtml(beat.body)}</div>
      ${beat.actions ? `<div class="actions">${beat.actions.map(a => `<span>${escapeHtml(a)}</span>`).join('')}</div>` : ''}
    </div>`;
}

function renderCharacter(c, killerId) {
  const cls = c.optional ? 'character optional' : 'character core';
  const killerTag = c.id === killerId ? '<span class="killer-tag">KILLER</span>' : '';
  const optTag = c.optional ? '<span class="optional-tag">OPTIONAL</span>' : '';
  return `
    <div class="${cls}">
      <div class="who">${escapeHtml(c.name)}${killerTag}${optTag}</div>
      <div class="role">${escapeHtml(c.role)}</div>
      <div class="lbl">AGENDA</div>
      <div class="agenda">${escapeHtml(c.objective)}</div>
      <div class="lbl">SECRET</div>
      <div class="secret">${escapeHtml(c.secret)}</div>
    </div>`;
}

function formatThread(line) {
  // Bold any "T+N" reference for scannability
  return escapeHtml(line).replace(/(T\+\d+)/g, '<b>$1</b>');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

init();
</script>

</body>
</html>
